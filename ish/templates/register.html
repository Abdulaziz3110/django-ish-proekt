{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-8 col-lg-6">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
            <div class="card-header bg-primary text-white text-center py-4">
                <h3 class="fw-bold mb-1"><i class="fa-solid fa-user-plus me-2"></i>Xodimlarni Ro'yxatdan O'tkazish</h3>
                <p class="text-white-50 mb-0">Tizimdan foydalanish uchun ma'lumotlaringizni kiriting</p>
            </div>
            <div class="card-body p-4 p-md-5">
                {% if error %}
                <div class="alert alert-danger alert-dismissible fade show rounded-3 mb-4" role="alert">
                    <i class="fa-solid fa-circle-exclamation me-2"></i>{{ error }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endif %}

                <form method="POST" action="{% url 'register' %}">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-dark">Ism <span class="text-danger">*</span></label>
                            <input type="text" name="ism" class="form-control rounded-3" placeholder="Masalan: Ali" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-dark">Familiya <span class="text-danger">*</span></label>
                            <input type="text" name="familiya" class="form-control rounded-3" placeholder="Masalan: Valiyev" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-dark">Username (Login) <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted"></i></span>
                                <input type="text" name="username" class="form-control rounded-end-3" placeholder="ali_valiyev" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-dark">Parol <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                                <input type="password" name="password" class="form-control rounded-end-3" placeholder="••••••••" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-dark">Bo'lim</label>
                            <input type="text" name="bolim" class="form-control rounded-3" placeholder="Masalan: Tikuvchilik">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-dark">Lavozim</label>
                            <input type="text" name="lavozim" class="form-control rounded-3" placeholder="Masalan: Usta">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold text-dark">Telefon raqam</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fa-solid fa-phone text-muted"></i></span>
                                <input type="text" name="telefon" class="form-control rounded-end-3" placeholder="+998 90 123 45 67">
                            </div>
                        </div>
                    </div>

                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary w-100 py-3 rounded-3 fw-semibold shadow-sm fs-5">
                            <i class="fa-solid fa-check-circle me-2"></i>Ro'yxatdan o'tish
                        </button>
                    </div>
                </form>
            </div>
            <div class="card-footer bg-light text-center py-3">
                <span class="text-muted">Allaqachon hisobingiz bormi?</span>
                <a href="{% url 'login' %}" class="fw-bold text-primary ms-1 text-decoration-none">Tizimga kirish</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
